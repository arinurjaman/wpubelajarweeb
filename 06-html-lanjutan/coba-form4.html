<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elemen Form</title>
  </head>
  <body>
    <h1>Macam - Macam Elemen Form di dalam Tabel</h1>
    <form>
      <table cellpadding="5">
        <tr>
          <td align="right"><label for="nama">Nama: </label></td>
          <td>
            <input
              type="text"
              name="nama"
              id="nama"
              placeholder="Masukkan Nama"
            />
          </td>
        </tr>
        <tr>
          <td align="right"><label for="password">Password: </label></td>
          <td>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Masukkan Password"
            />
          </td>
        </tr>
        <tr>
          <td align="right"><label for="email">Email: </label></td>
          <td>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Masukkan Email"
            />
          </td>
        </tr>
        <tr>
          <td align="right"><label for="number">Angka: </label></td>
          <td>
            <input
              type="number"
              name="number"
              id="number"
              min="0"
              max="100"
              step="10"
            />
          </td>
        </tr>
        <tr>
          <td align="right"><label for="tanggal"> Tanggal: </label></td>
          <td><input type="date" name="tanggal" id="tanggal" /></td>
        </tr>
        <tr>
          <td align="right"><label for="warna"> Warna: </label></td>
          <td><input type="color" name="warna" id="warna" /></td>
        </tr>
        <tr>
          <td align="right"><label for="telepon">No. Telepon: </label></td>
          <td>
            <input
              type="tel"
              name="telepon"
              id="telepon"
              placeholder="contoh:0878xxxxxx"
            />
          </td>
        </tr>
        <tr>
          <td align="right"><label for="file">File: </label></td>
          <td><input type="file" name="file" id="file" /></td>
        </tr>
        <tr>
          <td><button type="submit">Kirim</button></td>
          <td></td>
        </tr>
      </table>

      <br />

      <br />

      <br />

      <br />

      <br />

      <br />

      <br />

      <br />
    </form>
  </body>
</html>
