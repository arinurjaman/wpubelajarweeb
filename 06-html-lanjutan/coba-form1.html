<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elemen Form</title>
  </head>
  <body>
    <h1>Macam - Macam Elemen Form</h1>

    <form>
      <label for="nama"
        >Nama:
        <input type="text" name="nama" id="nama" placeholder="Masukkan Nama" />
      </label>

      <br />

      <label for="password"
        >Password:
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Masukkan Password"
        />
      </label>

      <br />

      <label for="email"
        >Email:
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Masukkan Email"
        />
      </label>

      <br />

      <label for="number"
        >Angka:
        <input
          type="number"
          name="number"
          id="number"
          min="0"
          max="100"
          step="10"
        />
      </label>

      <br />

      <label for="tanggal">
        Tanggal:
        <input type="date" name="tanggal" id="tanggal" />
      </label>

      <br />

      <label for="warna">
        Warna:
        <input type="color" name="warna" id="warna" />
      </label>

      <br />

      <label for="telepon"
        >No. Telepon:
        <input
          type="tel"
          name="telepon"
          id="telepon"
          placeholder="contoh:0878xxxxxx"
        />
      </label>

      <br />

      <label for="file"
        >File:
        <input type="file" name="file" id="file" />
      </label>

      <br />

      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
