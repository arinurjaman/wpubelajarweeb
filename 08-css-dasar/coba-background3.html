<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background</title>
    <style>
      body {
        background-color: lightblue;
        background-image: linear-gradient(to right, lightgreen, lightblue);
        
      }

      .kotak1 {
        width: 200px;
        height: 200px;
        background-color: salmon;
        background-image: linear-gradient(to bottom, rgb(236, 144, 238), rgb(255, 25, 0));
      }
      .kotak2 {
        width: 200px;
        height: 200px;
        background-color: salmon;
        background-image: radial-gradient(rgb(147, 144, 238), rgb(255, 25, 0));
      }
      .kotak3 {
        width: 200px;
        height: 200px;
        background-color: salmon;
        background-image: conic-gradient( rgb(238, 144, 200), rgb(255, 25, 0));
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
