<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qoute Galau Aesthetic</title>

    <style>
      body {
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.806), rgba(0, 0, 0, 0.6)),
          url(img/pohon.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      h1 {
        color: #37bcff;
        font-size: 50px;
        text-align: center;
        word-spacing: 20px;
        letter-spacing: 15px;
        font-family: "Bradley Hand ITC Regular", sans-serif;
        font-style: italic;
        text-shadow: 0 0 10px #00aaff;
      }

      .quote {
        color: #f8f8ff;
        font-size: 25px;
        text-align: center;
        font-family: "Bradley Hand ITC Regular", sans-serif;
        word-spacing: 10px;
        line-height: 40px;
        background-color: rgba(255, 255, 255, 0.048);
        max-width: 600px;
        margin: auto;
        padding: 10px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.509);
      }
      span {
        color: #c91741;
        text-shadow: 0 0 10px #c91741;
      }

      .penyanyi {
        text-transform: uppercase;
        font-size: 15px;
        color: #848997;
        text-align: center;
        font-family: "Bradley Hand ITC Regular", sans-serif;
        border-top: 1px solid rgba(255, 255, 255, 0.187);
        width: 30%;
        margin: 30px auto;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>FASE RUNTUH</h1>
    <div class="quote">
      <p>"Tak perlu khawatir, ku hanya <span>terluka.</span></p>
      <p>Terbiasa tuk pura-pura tertawa.</p>
      <p>Namun bolehkah sekali saja ku menangis?</p>
      <p>Sebelum kembali membohongi diri."</p>
    </div>

    <p class="penyanyi">- feby putri feat fiersa besari</p>
  </body>
</html>
