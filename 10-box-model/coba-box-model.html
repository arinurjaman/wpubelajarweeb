<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Box Model</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .kotak1 {
        width: 300px;
        height: 300px;
        background-color: red;
        margin: 20px;
        padding: 20px;
      }

      .kotak2 {
        width: 200px;
        height: 200px;
        background-color: antiquewhite;
        margin: -100px 70px 0 70px;
        padding: 20px;
      }

      /* margin : boleh negatif, px % auto */
      /* padding : tidak boleh negatif, px % tidak ada auto */
      /* short hand : 50px (atas bawah kiri kanan sama ) 
                      50px auto (atas bawah, kiri kanan)
                      50px auto 50px (atas, kiri kanan, bawah)
                      50px 50px 50px 50px (atas lalu searah jarum jam ) */
    </style>
  </head>
  <body>
    <div class="kotak1">1</div>
    <div class="kotak2"></div>
  </body>
</html>
