<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Size Option</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: rgb(240, 240, 240);
        font-family: Arial, Helvetica, sans-serif;
        padding: 20px;
      }

      .product {
        background-color: white;
        margin: 0 auto;
        width: 400px;
        border: 1px solid lightgrey;
        border-radius: 10px;
        padding: 20px;
      }

      .wrapper {
        border: none;
      }

      .label-size {
        font-weight: bold;
        color: rgb(30, 30, 30);
        margin-bottom: 12px;
      }

      .size-option {
        margin-bottom: 20px;
      }

      .size-option input[type="radio"] {
        display: none;
      }

      .size-option label {
        display: inline-block;
        width: 40px;
        height: 40px;
        background-color: #f3f3f3;
        border: 1px solid #c0c0c0;
        margin-right: 10px;
        text-align: center;
        border-radius: 5px;
        line-height: 38px;
        cursor: pointer;
        font-weight: bold;
        color: rgb(70, 70, 70);
      }

      .size-option input[type="radio"]:checked + label {
        background-color: black;
        color: white;
        border: black;
      }

      .keranjang {
        width: 100%;
        padding: 15px;
        border-radius: 5px;
        color: white;
        background-color: black;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        transition: transform 0.3s ease;
      }

      .keranjang:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <article class="product">
      <form action="">
        <fieldset class="wrapper">
          <legend class="label-size">Pilih Ukuran (US) :</legend>
          <div class="size-option">
            <input type="radio" name="size" id="s8" value="8" />
            <label for="s8">8</label>
            <input type="radio" name="size" id="s9" value="9" />
            <label for="s9">9</label>
            <input type="radio" name="size" id="s10" value="10" />
            <label for="s10">10</label>
            <input type="radio" name="size" id="s11" value="11" />
            <label for="s11">11</label>
            <input type="radio" name="size" id="s12" value="12" />
            <label for="s12">12</label>
          </div>
        </fieldset>

        <button class="keranjang" type="submit">Tambahkan Ke Keranjang</button>
      </form>
    </article>
  </body>
</html>
