<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Tag List</title>
</head>
<body>
  <h2> Coba ordered list / daftar terurut</h2>
  <ol>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
    <li>item 4</li>
    <li>item 5</li>
  </ol>
  <h2> Coba unordered list / daftar tidak terurut</h2>
  <ul>
    <li>item 1</li>
    <li>item 2</li>
    <li>item 3</li>
    <li>item 4</li>
    <li>item 5</li>
  </ul>
  
  <h2> Description List</h2>
  <dl>
    <dt>HTML</dt>
    <dd>Hyper Text Markup Language</dd>
  </dl>
  <dl>
    <dt>CSS</dt>
    <dd>Cascading Style Sheet </dd>
  </dl>

</body>
</html>
